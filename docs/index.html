<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Enqiu is a type-safe background job queue for browsers, Node.js, and Bun. Start in memory, move to Redis when you need durability."
    />
    <meta name="theme-color" content="#fffefa" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23171720'/%3E%3Cpath d='M17 15h28v9H28v6h14v8H28v6h17v9H17z' fill='%23fffefa'/%3E%3Ccircle cx='47' cy='47' r='9' fill='%23ef705d'/%3E%3C/svg%3E"
    />
    <title>Enqiu — Queues without ceremony</title>
    <style>
      :root {
        --ink: #171720;
        --muted: #666575;
        --paper: #fffefa;
        --canvas: #f5f4fa;
        --line: #dedce8;
        --line-strong: #c9c6d7;
        --violet: #5968f6;
        --violet-soft: #eceeff;
        --coral: #ef705d;
        --coral-soft: #fff0ec;
        --mint: #31a97a;
        --mint-soft: #e8f8f1;
        --display: "Avenir Next", Avenir, "Segoe UI", sans-serif;
        --body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: var(--body);
        -webkit-font-smoothing: antialiased;
      }

      a { color: inherit; text-decoration: none; }
      button, input { font: inherit; }
      button { color: inherit; cursor: pointer; }

      :focus-visible {
        outline: 3px solid rgb(89 104 246 / 30%);
        outline-offset: 3px;
      }

      .skip-link {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 100;
        padding: 10px 14px;
        color: white;
        background: var(--ink);
        transform: translateY(-160%);
      }

      .skip-link:focus { transform: translateY(0); }

      .topbar {
        position: relative;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(1420px, calc(100% - 48px));
        min-height: 78px;
        margin: 0 auto;
        border-bottom: 1px solid var(--line);
      }

      .wordmark {
        font-family: var(--display);
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -1.7px;
      }

      .wordmark span { color: var(--coral); }

      .top-links {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .top-links a {
        padding: 9px 12px;
        color: var(--muted);
        border-radius: 9px;
        font-size: 13px;
        font-weight: 700;
      }

      .top-links a:hover { color: var(--ink); background: var(--canvas); }
      .top-links .nav-primary { color: white; background: var(--ink); }
      .top-links .nav-primary:hover { color: white; background: #2c2c38; }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 0.88fr) minmax(560px, 1.12fr);
        gap: clamp(44px, 7vw, 108px);
        align-items: center;
        width: min(1320px, calc(100% - 48px));
        min-height: calc(100vh - 78px);
        margin: 0 auto;
        padding: 72px 0 88px;
      }

      .eyebrow,
      .section-kicker,
      .mini-label {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .signal {
        display: inline-flex;
        gap: 3px;
      }

      .signal i {
        width: 6px;
        height: 6px;
        border-radius: 2px;
        background: var(--violet);
      }

      .signal i:nth-child(2) { background: var(--coral); }
      .signal i:nth-child(3) { background: var(--mint); }

      h1, h2, h3, p { margin-top: 0; }

      h1 {
        max-width: 720px;
        margin: 23px 0 25px;
        font-family: var(--display);
        font-size: clamp(56px, 6.7vw, 102px);
        line-height: 0.91;
        letter-spacing: -0.072em;
      }

      h1 span {
        display: block;
        color: var(--violet);
      }

      .hero-copy > p {
        max-width: 620px;
        margin-bottom: 31px;
        color: var(--muted);
        font-size: clamp(17px, 1.5vw, 20px);
        line-height: 1.65;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 0 20px;
        border: 1px solid var(--line-strong);
        border-radius: 11px;
        background: var(--paper);
        font-size: 13px;
        font-weight: 800;
        transition: transform 160ms var(--ease), background 160ms ease;
      }

      .button:hover { transform: translateY(-2px); }
      .button.primary { color: white; border-color: var(--ink); background: var(--ink); }
      .button.primary::after { content: "→"; margin-left: 24px; font-size: 18px; }

      .install-command {
        display: inline-flex;
        align-items: center;
        min-height: 50px;
        padding: 0 6px 0 16px;
        color: var(--muted);
        border: 1px solid var(--line-strong);
        border-radius: 11px;
        background: var(--paper);
        font-family: var(--mono);
        font-size: 12px;
      }

      .install-command button {
        min-width: 54px;
        min-height: 38px;
        margin-left: 16px;
        border: 0;
        border-radius: 8px;
        background: var(--canvas);
        font-family: var(--body);
        font-size: 10px;
        font-weight: 800;
      }

      .support-note {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 23px;
        color: var(--muted);
        font-size: 12px;
      }

      .support-note i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--mint);
        box-shadow: 0 0 0 5px var(--mint-soft);
      }

      .lab-wrap { position: relative; }

      .lab-shadow {
        position: absolute;
        inset: 24px -18px -18px 30px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--violet-soft);
      }

      .queue-lab {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 18px;
        background: var(--paper);
        box-shadow: 0 24px 64px rgb(23 23 32 / 10%);
      }

      .lab-topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 53px;
        padding: 0 17px;
        border-bottom: 1px solid var(--line);
      }

      .lab-topline strong { font-size: 12px; }

      .real-chip,
      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        background: var(--canvas);
        font-size: 9px;
        font-weight: 800;
      }

      .real-chip i,
      .status-chip i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--mint);
      }

      .lab-code {
        padding: 19px 21px;
        color: #e8e8f2;
        border-bottom: 1px solid #2d2d38;
        background: var(--ink);
        font-family: var(--mono);
        font-size: clamp(10px, 1vw, 12px);
        line-height: 1.8;
      }

      .lab-code .violet { color: #aab2ff; }
      .lab-code .coral { color: #ff9e8e; }
      .lab-code .mint { color: #65d7ac; }
      .lab-code .dim { color: #9695a6; }

      .lab-stage { padding: 25px 22px 22px; }

      .queue-track {
        position: relative;
        min-height: 100px;
        margin: 0 4px 17px;
      }

      .track-line {
        position: absolute;
        top: 30px;
        right: 8%;
        left: 8%;
        height: 2px;
        background: var(--line);
      }

      .track-line::after {
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--job-progress, 12%);
        content: "";
        background: var(--violet);
        transition: width 600ms var(--ease);
      }

      .runner {
        position: absolute;
        top: 21px;
        left: 8%;
        z-index: 2;
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        border: 3px solid var(--paper);
        border-radius: 6px;
        background: var(--violet);
        box-shadow: 0 0 0 1px var(--violet);
        transition: left 650ms var(--ease), background 220ms ease, box-shadow 220ms ease;
      }

      .queue-track[data-state="working"] .runner {
        left: calc(50% - 10px);
        background: var(--coral);
        box-shadow: 0 0 0 1px var(--coral);
        animation: working-pulse 1.1s ease-in-out infinite;
      }

      .queue-track[data-state="complete"] .runner {
        left: calc(92% - 20px);
        background: var(--mint);
        box-shadow: 0 0 0 1px var(--mint);
      }

      .stage-labels {
        position: absolute;
        top: 53px;
        right: 0;
        left: 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }

      .stage-labels span {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
      }

      .stage-labels span[aria-current="step"] { color: var(--ink); }

      .job-token {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        min-height: 82px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: white;
        transition: border-color 200ms ease, transform 300ms var(--ease);
      }

      .job-token[data-state="working"] { border-color: var(--coral); transform: translateY(-2px); }
      .job-token[data-state="complete"] { border-color: var(--mint); }

      .ticket-mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 9px;
        color: white;
        background: var(--violet);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 800;
      }

      .job-copy { min-width: 0; }
      .job-copy strong { display: block; margin-bottom: 5px; font-family: var(--mono); font-size: 11px; }
      .job-copy output { display: block; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .job-result { max-width: 200px; }

      .lab-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 13px;
      }

      .run-job,
      .queue-reset {
        min-height: 44px;
        padding: 0 15px;
        border: 1px solid var(--ink);
        border-radius: 9px;
        font-size: 11px;
        font-weight: 800;
      }

      .run-job { color: white; background: var(--ink); }
      .queue-reset { color: var(--muted); border-color: var(--line-strong); background: var(--paper); }

      .lab-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 22px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        background: var(--canvas);
        font-family: var(--mono);
        font-size: 9px;
      }

      .lab-footer a { color: var(--violet); font-weight: 800; }

      .proof-strip {
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: var(--canvas);
      }

      .proof-inner {
        display: grid;
        grid-template-columns: 1.4fr repeat(5, auto);
        gap: 34px;
        align-items: center;
        width: min(1320px, calc(100% - 48px));
        min-height: 88px;
        margin: 0 auto;
      }

      .proof-inner strong { max-width: 310px; font-family: var(--display); font-size: 15px; line-height: 1.35; }
      .proof-inner span { color: var(--muted); font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

      .section {
        width: min(1200px, calc(100% - 48px));
        margin: 0 auto;
        padding: 120px 0;
      }

      .section-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 0.55fr);
        gap: 60px;
        align-items: end;
        margin-bottom: 54px;
      }

      .section-heading h2 {
        max-width: 760px;
        margin: 15px 0 0;
        font-family: var(--display);
        font-size: clamp(42px, 5vw, 72px);
        line-height: 0.98;
        letter-spacing: -0.058em;
      }

      .section-heading > p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.7; }

      .quick-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        overflow: hidden;
      }

      .code-panel { min-width: 0; color: #e9e9f1; background: var(--ink); }
      .code-title, .result-title { display: flex; align-items: center; justify-content: space-between; min-height: 49px; padding: 0 18px; border-bottom: 1px solid #343440; font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      pre { margin: 0; overflow-x: auto; padding: 28px; font-family: var(--mono); font-size: 12px; line-height: 1.9; }
      .code-violet { color: #aab2ff; }
      .code-coral { color: #ff9e8e; }
      .code-mint { color: #65d7ac; }
      .code-muted { color: #9998aa; }

      .result-panel { padding-bottom: 25px; background: var(--violet-soft); }
      .result-title { color: var(--muted); border-color: #d8daf8; }
      .result-stack { display: grid; gap: 10px; padding: 26px; }
      .result-row { display: grid; grid-template-columns: 92px 1fr; gap: 18px; align-items: center; min-height: 58px; padding: 0 14px; border: 1px solid #d6d8f5; border-radius: 10px; background: var(--paper); }
      .result-row span { color: var(--muted); font-family: var(--mono); font-size: 9px; text-transform: uppercase; }
      .result-row strong { font-family: var(--mono); font-size: 11px; }

      .capabilities { background: var(--canvas); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .capabilities .section { width: min(1320px, calc(100% - 48px)); }
      .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line-strong); border-radius: 16px; overflow: hidden; }
      .feature-card { min-height: 260px; padding: 27px; border-right: 1px solid var(--line); background: var(--paper); }
      .feature-card:last-child { border-right: 0; }
      .feature-number { display: grid; place-items: center; width: 36px; height: 36px; margin-bottom: 58px; border-radius: 9px; color: var(--violet); background: var(--violet-soft); font-family: var(--mono); font-size: 10px; font-weight: 800; }
      .feature-card:nth-child(2) .feature-number { color: #b34b3b; background: var(--coral-soft); }
      .feature-card:nth-child(3) .feature-number { color: #217d5b; background: var(--mint-soft); }
      .feature-card h3 { margin-bottom: 11px; font-family: var(--display); font-size: 23px; letter-spacing: -0.04em; }
      .feature-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }

      .drivers {
        display: grid;
        grid-template-columns: 1fr 80px 1fr;
        align-items: stretch;
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        overflow: hidden;
      }

      .driver-card { padding: 35px; background: var(--paper); }
      .driver-card h3 { margin: 42px 0 12px; font-family: var(--display); font-size: 31px; letter-spacing: -0.05em; }
      .driver-card p { max-width: 410px; margin-bottom: 25px; color: var(--muted); font-size: 14px; line-height: 1.7; }
      .driver-card code { display: inline-block; padding: 10px 12px; border-radius: 8px; background: var(--canvas); font-family: var(--mono); font-size: 10px; }
      .driver-arrow { display: grid; place-items: center; border-right: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--violet-soft); font-family: var(--mono); font-size: 21px; }

      .contract { display: grid; grid-template-columns: 0.75fr 1.25fr; gap: 70px; align-items: start; }
      .contract h2 { margin: 16px 0 22px; font-family: var(--display); font-size: clamp(44px, 5vw, 72px); line-height: 0.96; letter-spacing: -0.06em; }
      .contract-copy > p { max-width: 430px; color: var(--muted); font-size: 15px; line-height: 1.7; }
      .contract-list { border-top: 1px solid var(--line-strong); }
      .contract-item { display: grid; grid-template-columns: 44px 170px 1fr; gap: 18px; align-items: start; padding: 23px 0; border-bottom: 1px solid var(--line); }
      .contract-item > span { color: var(--violet); font-family: var(--mono); font-size: 10px; font-weight: 800; }
      .contract-item strong { font-size: 13px; }
      .contract-item p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }

      .final-cta {
        position: relative;
        overflow: hidden;
        width: min(1320px, calc(100% - 48px));
        margin: 0 auto 34px;
        padding: clamp(44px, 7vw, 90px);
        color: white;
        border-radius: 18px;
        background: var(--ink);
      }

      .final-cta::after {
        position: absolute;
        right: clamp(24px, 8vw, 120px);
        bottom: -54px;
        width: 170px;
        height: 170px;
        content: "";
        border: 34px solid var(--violet);
        border-radius: 32px;
        transform: rotate(17deg);
      }

      .final-cta h2 { position: relative; z-index: 1; max-width: 800px; margin: 0 0 30px; font-family: var(--display); font-size: clamp(45px, 6vw, 82px); line-height: 0.95; letter-spacing: -0.06em; }
      .final-cta .button { position: relative; z-index: 1; color: var(--ink); border-color: white; background: white; }
      .final-actions { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 10px; }
      .final-install { display: inline-flex; align-items: center; min-height: 50px; padding: 0 6px 0 17px; color: white; border: 1px solid #4a4956; border-radius: 11px; background: transparent; font-family: var(--mono); font-size: 11px; }
      .final-install span { display: grid; min-height: 38px; margin-left: 18px; padding: 0 12px; place-items: center; border-radius: 8px; background: #2c2c38; font-family: var(--body); font-size: 10px; font-weight: 800; }

      footer { display: flex; justify-content: space-between; width: min(1320px, calc(100% - 48px)); margin: 0 auto; padding: 25px 0 34px; color: var(--muted); font-size: 11px; }

      .sr-only { position: absolute; overflow: hidden; width: 1px; height: 1px; padding: 0; margin: -1px; white-space: nowrap; border: 0; clip: rect(0, 0, 0, 0); }

      @keyframes working-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.18); }
      }

      @media (max-width: 980px) {
        .hero { grid-template-columns: 1fr; min-height: auto; padding-top: 64px; }
        .hero-copy { max-width: 760px; }
        .lab-wrap { width: min(700px, 100%); }
        .proof-inner { grid-template-columns: repeat(3, 1fr); padding: 22px 0; }
        .proof-inner strong { grid-column: 1 / -1; }
        .section-heading { grid-template-columns: 1fr; gap: 18px; }
        .quick-grid, .contract { grid-template-columns: 1fr; }
        .feature-grid { grid-template-columns: 1fr; }
        .feature-card { min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
        .feature-card:last-child { border-bottom: 0; }
        .feature-number { margin-bottom: 32px; }
      }

      @media (max-width: 680px) {
        .topbar, .hero, .proof-inner, .section, .capabilities .section, .final-cta, footer { width: min(100% - 28px, 1320px); }
        .topbar { min-height: 66px; }
        .top-links a:not(.nav-primary) { display: none; }
        .top-links .nav-primary { padding: 9px 11px; font-size: 11px; }
        .hero { gap: 52px; padding: 52px 0 66px; }
        h1 { font-size: clamp(52px, 17vw, 74px); }
        .hero-copy > p { font-size: 16px; }
        .hero-actions { align-items: stretch; }
        .button.primary { width: 100%; }
        .install-command { width: 100%; justify-content: space-between; }
        .lab-shadow { inset: 14px -7px -9px 14px; }
        .lab-code { padding: 16px; font-size: 9px; }
        .lab-stage { padding: 18px 13px 14px; }
        .job-token { grid-template-columns: auto minmax(0, 1fr); }
        .job-result { grid-column: 1 / -1; max-width: none; padding-left: 50px; }
        .lab-actions { align-items: stretch; }
        .run-job { flex: 1; }
        .lab-footer { align-items: flex-start; gap: 12px; }
        .proof-inner { grid-template-columns: repeat(2, 1fr); gap: 17px; }
        .section { padding: 84px 0; }
        .section-heading { margin-bottom: 34px; }
        .section-heading h2, .contract h2 { font-size: 45px; }
        .quick-grid { border-radius: 13px; }
        pre { padding: 20px 17px; font-size: 10px; }
        .result-stack { padding: 17px; }
        .drivers { grid-template-columns: 1fr; }
        .driver-arrow { min-height: 58px; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(90deg); }
        .driver-card { padding: 27px; }
        .driver-card h3 { margin-top: 30px; }
        .contract { gap: 38px; }
        .contract-item { grid-template-columns: 32px 1fr; }
        .contract-item p { grid-column: 2; }
        .final-cta { padding: 48px 27px 118px; }
        .final-cta::after { right: 34px; width: 110px; height: 110px; border-width: 23px; }
        .final-actions { align-items: stretch; }
        .final-actions .button, .final-install { width: 100%; }
        .final-install { justify-content: space-between; }
        footer { display: grid; gap: 8px; }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="topbar">
      <a class="wordmark" href="#top" aria-label="Enqiu home">enqiu<span>.</span></a>
      <nav class="top-links" aria-label="Top navigation">
        <a href="#quick-start">Docs</a>
        <a href="https://github.com/moji2002/enqiu">GitHub ↗</a>
        <a class="nav-primary" href="/playground">Open playground</a>
      </nav>
    </header>

    <main id="content">
      <section class="hero" id="top" aria-labelledby="hero-title">
        <div class="hero-copy">
          <div class="eyebrow"><span class="signal" aria-hidden="true"><i></i><i></i><i></i></span> Type-safe jobs · Browser ready</div>
          <h1 id="hero-title">Background jobs,<span>called like functions.</span></h1>
          <p>
            Define handlers once. Enqiu gives you typed calls, retries, schedules,
            progress, cancellation, and inspectable history—without a framework around your framework.
          </p>
          <div class="hero-actions">
            <a class="button primary" href="/playground">Try the live queue</a>
            <div class="install-command"><span>pnpm add enqiu</span><button type="button" id="copy-install" aria-label="Copy install command">Copy</button></div>
          </div>
          <div class="support-note"><i aria-hidden="true"></i> The memory driver runs in modern browsers, Node.js, and Bun.</div>
        </div>

        <div class="lab-wrap">
          <div class="lab-shadow" aria-hidden="true"></div>
          <section class="queue-lab" id="queue-lab" data-state="queued" aria-labelledby="lab-heading">
            <h2 id="lab-heading" class="sr-only">Queue lifecycle playground</h2>
            <div class="lab-topline">
              <strong>sendEmail()</strong>
              <span class="real-chip"><i aria-hidden="true"></i> Actual Enqiu queue</span>
            </div>
            <div class="lab-code" aria-label="Enqiu code example">
              <span class="violet">const</span> jobs = <span class="coral">enqiu</span>({<br />
              &nbsp;&nbsp;<span class="mint">sendEmail</span>: <span class="violet">async</span> ({ to }, ctx) =&gt; {<br />
              &nbsp;&nbsp;&nbsp;&nbsp;<span class="dim">await</span> ctx.reportProgress({ completed: <span class="coral">1</span>, total: <span class="coral">2</span> })<br />
              &nbsp;&nbsp;&nbsp;&nbsp;<span class="violet">return</span> mail.send(to)<br />
              &nbsp;&nbsp;}<br />
              })<br /><br />
              <span class="violet">await</span> jobs.<span class="mint">sendEmail</span>({ to: <span class="coral">"you@example.com"</span> })
            </div>
            <div class="lab-stage">
              <div class="queue-track" id="queue-track" data-state="queued">
                <div class="track-line" aria-hidden="true"></div>
                <span class="runner" aria-hidden="true"></span>
                <div class="stage-labels" aria-label="Job lifecycle">
                  <span data-stage="queued">Queued</span>
                  <span data-stage="working">Working</span>
                  <span data-stage="complete">Result</span>
                </div>
              </div>
              <article class="job-token" id="job-token" data-state="queued">
                <span class="ticket-mark" aria-hidden="true">J</span>
                <div class="job-copy">
                  <strong id="job-status">Ready to run</strong>
                  <output class="job-result" id="job-result" aria-live="polite">Powered by the real Enqiu memory driver</output>
                </div>
                <span class="status-chip"><i aria-hidden="true"></i> Live</span>
              </article>
              <div class="lab-actions">
                <button class="run-job" id="run-job" type="button">Run sendEmail()</button>
                <button class="queue-reset" id="queue-reset" type="button">Reset</button>
              </div>
            </div>
            <div class="lab-footer">
              <span>Nothing simulated—the package runs here.</span>
              <a href="/playground">Open full workbench →</a>
            </div>
          </section>
        </div>
      </section>

      <div class="proof-strip" aria-label="Enqiu capabilities">
        <div class="proof-inner">
          <strong>Small API. Serious queue behavior.</strong>
          <span>Type inference</span><span>Retries</span><span>Schedules</span><span>Progress</span><span>Cancellation</span>
        </div>
      </div>

      <section class="section" id="quick-start" aria-labelledby="quick-title">
        <div class="section-heading">
          <div><div class="section-kicker">01 · Define and call</div><h2 id="quick-title">If it looks like a function, use it like one.</h2></div>
          <p>Your handler map becomes the API. Inputs are inferred, job options stay explicit, and every call returns a handle you can await or cancel.</p>
        </div>
        <div class="quick-grid">
          <div class="code-panel">
            <div class="code-title"><span>jobs.ts</span><span>TypeScript</span></div>
            <pre><span class="code-violet">import</span> { enqiu } <span class="code-violet">from</span> <span class="code-coral">"enqiu"</span>

<span class="code-violet">const</span> jobs = <span class="code-mint">enqiu</span>({
  sendEmail: <span class="code-violet">async</span> ({ to, subject }, ctx) =&gt; {
    <span class="code-violet">await</span> ctx.reportProgress({
      completed: <span class="code-coral">1</span>, total: <span class="code-coral">2</span>
    })
    <span class="code-violet">return</span> mail.send({ to, subject })
  }
})

<span class="code-violet">const</span> job = <span class="code-violet">await</span> jobs.<span class="token-call">sendEmail</span>({
  to: <span class="code-coral">"ada@example.com"</span>,
  subject: <span class="code-coral">"It shipped"</span>
})

<span class="code-violet">await</span> job.result</pre>
          </div>
          <div class="result-panel">
            <div class="result-title"><span>Job handle</span><span>Inspectable</span></div>
            <div class="result-stack">
              <div class="result-row"><span>Status</span><strong>Succeeded</strong></div>
              <div class="result-row"><span>Progress</span><strong>2 / 2</strong></div>
              <div class="result-row"><span>Attempt</span><strong>1 / 3</strong></div>
              <div class="result-row"><span>Result</span><strong>{ delivered: true }</strong></div>
            </div>
          </div>
        </div>
      </section>

      <div class="capabilities">
        <section class="section" aria-labelledby="behavior-title">
          <div class="section-heading">
            <div><div class="section-kicker">02 · Queue behavior</div><h2 id="behavior-title">The hard parts have names.</h2></div>
            <p>Enqiu keeps failure behavior visible in code instead of burying it behind a dashboard or a pile of configuration.</p>
          </div>
          <div class="feature-grid">
            <article class="feature-card"><span class="feature-number">01</span><h3>Retry with intent</h3><p>Backoff, attempt limits, timeouts, and expiry are policies on the job—not mysteries in a worker.</p></article>
            <article class="feature-card"><span class="feature-number">02</span><h3>Control live work</h3><p>Pause workers, change concurrency, cancel queued or running jobs, and report structured progress.</p></article>
            <article class="feature-card"><span class="feature-number">03</span><h3>Keep the evidence</h3><p>Inspect lifecycle history, logs, inputs, outputs, and errors through one consistent queue API.</p></article>
          </div>
        </section>
      </div>

      <section class="section" id="drivers" aria-labelledby="drivers-title">
        <div class="section-heading">
          <div><div class="section-kicker">03 · Drivers</div><h2 id="drivers-title">Start local. Add durability without rewriting jobs.</h2></div>
          <p>The memory driver makes tests, scripts, demos, and frontend playgrounds instant. Switch the driver when your process boundary becomes real.</p>
        </div>
        <div class="drivers">
          <article class="driver-card"><div class="mini-label"><span class="signal" aria-hidden="true"><i></i><i></i><i></i></span> Zero setup</div><h3>Memory</h3><p>Run the worker in the same browser, Node.js process, or Bun process. Ideal for development and deterministic tests.</p><code>enqiu(handlers)</code></article>
          <div class="driver-arrow" aria-hidden="true">→</div>
          <article class="driver-card"><div class="mini-label"><span class="signal" aria-hidden="true"><i></i><i></i><i></i></span> Durable</div><h3>Redis</h3><p>Keep the same typed calls and handler contract while moving queue state to shared infrastructure.</p><code>enqiu(handlers, { driver })</code></article>
        </div>
      </section>

      <section class="section contract" id="reliability" aria-labelledby="contract-title">
        <div class="contract-copy"><div class="section-kicker">04 · Reliability contract</div><h2 id="contract-title">Predictable when work gets messy.</h2><p>Queued work is a state machine. Enqiu exposes that state plainly so applications can make honest decisions.</p></div>
        <div class="contract-list">
          <div class="contract-item"><span>01</span><strong>At-least-once delivery</strong><p>Handlers can run again after failures. Use idempotency keys when side effects must be unique.</p></div>
          <div class="contract-item"><span>02</span><strong>Explicit terminal states</strong><p>Succeeded, failed, cancelled, and expired work remain distinguishable and inspectable.</p></div>
          <div class="contract-item"><span>03</span><strong>Abort-aware handlers</strong><p>Cancellation reaches running handlers through an AbortSignal instead of pretending work stopped.</p></div>
          <div class="contract-item"><span>04</span><strong>Typed end to end</strong><p>Handler input and result types flow into producer calls and job handles without manual duplication.</p></div>
        </div>
      </section>

      <section class="final-cta" aria-labelledby="cta-title">
        <h2 id="cta-title">Try it here. Install it anywhere.</h2>
        <div class="final-actions">
          <a class="button" href="/playground">Open the Enqiu playground →</a>
          <button class="final-install" type="button" data-copy-install>pnpm add enqiu <span>Copy</span></button>
        </div>
      </section>
    </main>

    <footer><span>Enqiu · Queues without ceremony.</span><span>MIT licensed · Built for browsers, Node.js, and Bun.</span></footer>

    </noscript>
    <script type="module" src="/landing.tsx"></script>
  </body>
</html>
